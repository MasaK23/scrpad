[package]
name = "scratchpad"
version = "0.1.0"
edition = "2024"
description = "A tiny frameless floating scratchpad"
license = "MIT"

[dependencies]
egui = "0.36"
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
eframe = { version = "0.36", default-features = false, features = ["wgpu", "wayland", "x11", "accesskit"] }
rfd = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["eframe", "wgpu"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
