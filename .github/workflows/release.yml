name: Release

# Pushing a tag like v0.1.0 builds the `dist` profile on every platform (a universal .app on macOS) and publishes a GitHub
# release with the archives and their checksums. Run it by hand to only build the archives.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 keeps the glibc requirement low enough for most distributions.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --locked --profile dist --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="scrpad-${GITHUB_REF_NAME}-${{ matrix.target }}"
          bin=scrpad
          [[ "$RUNNER_OS" == Windows ]] && bin=scrpad.exe
          mkdir -p "dist/$name/licenses"
          cp "target/${{ matrix.target }}/dist/$bin" README.md LICENSE "dist/$name/"
          cp assets/fonts/OFL-*.txt assets/icons/LICENSE-lucide.txt "dist/$name/licenses/"
          cd dist
          if [[ "$RUNNER_OS" == Windows ]]; then
            7z a "$name.zip" "$name" >/dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --profile dist --target aarch64-apple-darwin --target x86_64-apple-darwin
      - run: packaging/macos/bundle.sh
      - name: Package
        run: |
          name="scrpad-${GITHUB_REF_NAME}-macos-universal"
          mkdir -p "dist/$name/licenses"
          mv dist/scrpad.app "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          cp assets/fonts/OFL-*.txt assets/icons/LICENSE-lucide.txt "dist/$name/licenses/"
          # ditto keeps the bundle's signature and metadata intact, unlike plain zip.
          cd dist && ditto -c -k --keepParent "$name" "$name.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-universal
          path: dist/*.zip

  release:
    needs: [build, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check that the tag matches Cargo.toml
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - run: cd artifacts && sha256sum * > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
